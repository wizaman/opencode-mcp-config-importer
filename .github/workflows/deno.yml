name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install --frozen-lockfile

      - name: Check types
        run: deno task check

      - name: Verify formatting
        run: deno task fmt

      - name: Run linter
        run: deno task lint

      - name: Run tests
        run: deno task test
